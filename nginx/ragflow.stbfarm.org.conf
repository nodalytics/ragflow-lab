# Host nginx vhost for RAGFlow (research/ragflow/lab.sh: its web UI on the lab's 127.0.0.1:8088; RAGFlow's own nginx
# inside routes /api/v1 to its API). Installed by install-nginx.sh. DNS: ragflow.stbfarm.org is proxied by Cloudflare
# (SSL mode Full), with the lab's origin certificate shared with the other stbfarm.org vhosts.
# Locks: only Cloudflare reaches this site; RAGFlow needs a login, and self sign-up is off (the admin adds users).
# Put Cloudflare Access in front as well if only the team should see the login page.

# Cloudflare's edge ranges, as kestrel.stbfarm.org lists them (fetched 2026-11-10), and the lab itself
geo $realip_remote_addr $ragflow_via_cf {
    default 0;
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# per visitor (the real one: see set_real_ip_from); the login is limited harder
limit_req_zone $binary_remote_addr zone=ragflow_all:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ragflow_login:1m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ragflow.stbfarm.org;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    if ($ragflow_via_cf = 0) { return 403; }

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 512m;  # document uploads (Cloudflare's own limit is 100 MB on the free plan)

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    location ~ ^/(v1/user/login|api/v1/(auth|user)/login) {
        limit_req zone=ragflow_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
    }

    # chat answers stream: no buffering, a long read
    location / {
        limit_req zone=ragflow_all burst=100 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ragflow.stbfarm.org;
    return 301 https://$host$request_uri;
}
