# Host nginx vhost for the lab's coding models (coder/coder.sh: Ollama on the lab's 127.0.0.1:11435).
# Installed by deploy/install.sh, which also writes /etc/nginx/coder-keys.map from ~/coder/api-keys (one line per
# key: "Bearer <key>" <name>;). DNS: coder.stbfarm.org, proxied by Cloudflare (SSL mode Full), with the lab's origin
# certificate shared with the other stbfarm.org vhosts.
# Locks: only Cloudflare reaches this site; every request needs a key; only the /v1/ APIs are served (OpenAI's chat,
# completions, models, embeddings and responses, and Anthropic's messages), never Ollama's /api/, which pulls and
# deletes models.

geo $realip_remote_addr $coder_via_cf {
    default 0;
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# the keys ("Bearer sk-lab-" and 40 characters) are longer than the default bucket of 64 bytes allows
map_hash_bucket_size 128;

map $http_authorization $coder_user {
    default "";
    include /etc/nginx/coder-keys.map;
}

# per key; a coding agent sends a burst of requests per step
limit_req_zone $coder_user zone=coder_key:1m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coder.stbfarm.org;

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    if ($coder_via_cf = 0) { return 403; }

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 32m;  # long prompts: a whole repository's context

    location ^~ /v1/ {
        if ($coder_user = "") {
            add_header WWW-Authenticate 'Bearer realm="coder"' always;
            return 401 '{"error": "a valid API key is required (Authorization: Bearer ...)"}';
        }
        limit_req zone=coder_key burst=40 nodelay;
        proxy_pass http://127.0.0.1:11435;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:11435;  # Ollama checks the host it is called on
        proxy_set_header Authorization "";
        proxy_set_header X-Api-Key "";
        proxy_buffering off;              # answers stream token by token
        proxy_request_buffering off;
        proxy_read_timeout 900s;          # a long answer on a full context
        proxy_send_timeout 900s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name coder.stbfarm.org;
    return 301 https://$host$request_uri;
}
